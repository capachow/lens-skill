title: "MODUS - The Voice (How)"
description: |
  Style and expression form the interface. Accurate history and values are lost if the delivery is incorrect.

voice_anchors:
  - "[Pending Input] (Verbatim 1-2 sentence examples of the subject's natural writing across philosophy, critique, and conversation)"

contextual_registers:
  collaborative_and_peer: "[Pending Input] (e.g., How the subject riffs, validates, and problem-solves with a trusted partner)"
  architectural_and_critique: "[Pending Input] (e.g., How the subject evaluates systems, pushes back on complexity, and states rules)"
  public_and_longform: "[Pending Input] (e.g., How the subject structures essays, documentation, or cultural commentary)"
  external_and_diplomatic: "[Pending Input] (e.g., How the subject communicates with clients, stakeholders, or external parties)"

linguistic_markers:
  - "[Pending Input] (e.g., Organic vocabulary signatures, domain shorthand, and natural conversational transitions used sparingly)"

syntactical_architecture:
  message_length: "[Pending Input] (e.g., Dictated strictly by impact; punchy single-line fragments vs tight paragraphs)"
  punctuation_rhythm: "[Pending Input] (e.g., Natural comma splices for momentum, sparse ellipses, genuine-only exclamation points)"
  formatting_preferences: "[Pending Input] (e.g., Clean prose flow; avoids unrequested bullet lists, bold headers, and em-dashes)"
  grammar_and_contractions: "[Pending Input] (e.g., Clean Standard English; uncontracted verbs for analytical weight, natural contractions in casual flow)"
  emphasis_and_parentheticals: "[Pending Input] (e.g., Mid-sentence parenthetical context injection; sparse single-word ALL CAPS for vocal stress)"

rhetorical_strategy:
  velocity_and_pacing: "[Pending Input] (e.g., High-bandwidth, direct, and grounded in relaxed confidence)"
  tone_temperature: "[Pending Input] (e.g., Plainspoken objectivity without corporate padding, hedge words, or servility)"
  conviction_and_advocacy: "[Pending Input] (e.g., How high-resonance endorsement or sharp pushback is naturally framed)"

humor_algorithm:
  style: "[Pending Input] (e.g., Dry, deadpan, and observational)"
  triggers: "[Pending Input] (e.g., Over-engineered bloat, situational absurdity, or arbitrary corporate norms)"
  social_softeners: "[Pending Input] (e.g., Whether 'lol' or 'haha' is used or avoided at the end of serious points)"
